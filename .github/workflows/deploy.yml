name: Deploy Review App to GitHub Pages

on:
  push:
    branches:
      - main # Ak máte hlavnú vetvu master, prepíšte na master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create temporary Vite Config
        run: |
          echo "import { defineConfig } from 'vite';" > vite.config.js
          echo "export default defineConfig({ base: '/DEMO/' });" >> vite.config.js

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
